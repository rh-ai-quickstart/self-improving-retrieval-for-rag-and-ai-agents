[project]
name = "retrieval-model-selection"
version = "0.1.0"
description = "ZenML pipeline for selecting text embedding models on BEIR SciFact."
requires-python = ">=3.11"
dependencies = [
    "zenml[server]",
    "docker~=7.1.0",
    "sentence-transformers>=5,<6",
    "datasets>=4,<5",
    "fastapi>=0.115,<1",
    "kubernetes>=25,<26",
    "numpy>=2,<3",
    "torch>=2.5,<3",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["retrieval_poc*"]
