{{- if and .Values.s4.enabled .Values.s4Buckets.create }}
{{/*
Regular Job (not a Helm hook). Creates artifact buckets and smoke-tests S4's
S3 API with boto3 on UBI Python — never quay.io/minio/mc or Docker Hub images.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: s4-bootstrap
  labels:
    {{- include "zenml-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: s4-bootstrap
    app.kubernetes.io/component: s4
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "zenml-stack.labels" . | nindent 8 }}
        app.kubernetes.io/name: s4-bootstrap
        app.kubernetes.io/component: s4
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-s4
          image: {{ .Values.jobImages.cli | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for S4 UI at http://{{ include "s4.fullname" . }}:{{ include "s4.uiPort" . }}/api ..."
              until curl -sf "http://{{ include "s4.fullname" . }}:{{ include "s4.uiPort" . }}/api"; do
                echo -n "."
                sleep 5
              done
              echo
              echo "S4 UI is ready."
      containers:
        - name: create-buckets
          image: {{ .Values.jobImages.python | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "s4.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "s4.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: S4_ENDPOINT
              value: "http://{{ include "s4.fullname" . }}:{{ include "s4.apiPort" . }}"
            - name: S4_BUCKETS
              value: {{ .Values.s4Buckets.names | join "," | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              pip install --no-cache-dir -q boto3
              python3 <<'PY'
              import os
              import sys
              import time

              import boto3

              endpoint = os.environ["S4_ENDPOINT"]
              buckets = [name.strip() for name in os.environ["S4_BUCKETS"].split(",") if name.strip()]
              if not buckets:
                  print("No buckets configured", file=sys.stderr)
                  sys.exit(1)

              s3 = None
              for attempt in range(1, 37):
                  try:
                      client = boto3.client(
                          "s3",
                          endpoint_url=endpoint,
                          aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
                          aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
                          region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-1"),
                      )
                      client.list_buckets()
                      s3 = client
                      print(f"S3 API ready at {endpoint} (attempt {attempt})")
                      break
                  except Exception as exc:
                      print(f"Waiting for S3 API ({attempt}/36): {exc}")
                      time.sleep(5)
              if s3 is None:
                  print("S4 S3 API did not become ready", file=sys.stderr)
                  sys.exit(1)

              existing = {bucket["Name"] for bucket in s3.list_buckets().get("Buckets", [])}
              for bucket in buckets:
                  if bucket in existing:
                      print(f"Bucket already exists: {bucket}")
                  else:
                      print(f"Creating bucket: {bucket}")
                      s3.create_bucket(Bucket=bucket)
                      print(f"Created bucket: {bucket}")

              smoke_bucket = buckets[0]
              smoke_key = "smoke-test.txt"
              smoke_body = b"ZenML artifact store test\n"
              s3.put_object(Bucket=smoke_bucket, Key=smoke_key, Body=smoke_body)
              obj = s3.get_object(Bucket=smoke_bucket, Key=smoke_key)
              body = obj["Body"].read()
              if body != smoke_body:
                  print(f"Smoke test mismatch: got {body!r}", file=sys.stderr)
                  sys.exit(1)
              print(f"Smoke test passed for s3://{smoke_bucket}/{smoke_key}")
              print("All buckets ready!")
              PY
{{- end }}
