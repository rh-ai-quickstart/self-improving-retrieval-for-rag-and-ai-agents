subjects:
  - kind: ServiceAccount
    name: {{ include "zenml-stack.orchestratorServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
