{{- if .Values.minio.enabled }}
{{- $secretName := .Values.minio.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "MINIO_ROOT_PASSWORD" | b64dec }}
{{- else if .Values.minio.rootPassword }}
{{- $password = .Values.minio.rootPassword }}
{{- else }}
{{- $password = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "zenml-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $password | quote }}
{{- end }}
