{{- if .Values.mlflow.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.mlflow.roleBindingName }}
  labels:
    {{- include "zenml-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.mlflow.integrationClusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zenml-stack.orchestratorServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
