{{- if .Values.kserve.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.kserve.roleName }}
  labels:
    {{- include "zenml-stack.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.kserve.roleBindingName }}
  labels:
    {{- include "zenml-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.kserve.roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zenml-stack.orchestratorServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
