# Defaults mirror deployment.env.example. Override at install time from deployment.env.

orchestrator:
  serviceAccountName: zenml-orchestrator

# Images for Jobs / initContainers — avoid Docker Hub (rate limits on OpenShift)
jobImages:
  cli: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  python: registry.redhat.io/ubi9/python-311:latest
  shell: registry.redhat.io/ubi9/ubi-minimal:latest

# aws-compatible-storage (S4-backed) from ai-architecture-charts — values key is "s4" via Chart alias
# Runtime: quay.io/rh-aiservices-bu/s4 — S3 API :7480, Web UI :5000
# Chart: https://github.com/rh-ai-quickstart/ai-architecture-charts/tree/main/aws-compatible-storage
s4:
  enabled: true
  fullnameOverride: s4
  image:
    repository: quay.io/rh-aiservices-bu/s4
    tag: "0.3.2"
    pullPolicy: IfNotPresent
  s3:
    accessKeyId: s4admin
    secretAccessKey: s4secret
  auth:
    enabled: true
    username: admin
    # Override via secrets.yaml / deployment.env — do not commit production passwords.
    password: changeme
  route:
    enabled: true
    s3Api:
      # Required so ZenML CLI on the laptop can register the S3 artifact store.
      enabled: true
  storage:
    data:
      storageClass: gp3-csi
      size: 10Gi

# Parent chart Job: create S3 buckets (not part of the aws-compatible-storage subchart)
s4Buckets:
  create: true
  names:
    - zenml-artifacts

kserve:
  enabled: true
  roleName: zenml-kserve-deployer
  roleBindingName: zenml-kserve-deployer

mlflow:
  enabled: true
  instance: mlflow
  storageClass: gp3-csi
  storageSize: 10Gi
  integrationClusterRole: mlflow-operator-mlflow-integration
  roleBindingName: zenml-mlflow-integration
  # Keep the cluster-scoped CR when the release is uninstalled.
  retain: true

registry:
  enabled: true
  pullSecretName: openshift-registry-route-pull
  imageStreamName: zenml
  # Pull secret token is minted post-install by refresh/bootstrap registry script.
  createPullSecret: false
  dockerServer: ""
  dockerUsername: openshift
  dockerPassword: ""

commonLabels:
  app.kubernetes.io/part-of: zenml-stack-bootstrap
