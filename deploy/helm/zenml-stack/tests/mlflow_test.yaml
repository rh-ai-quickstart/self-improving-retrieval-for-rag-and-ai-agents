suite: MLflow custom resource
templates:
  - mlflow-cr.yaml
release:
  name: zenml-stack
  namespace: zenml-workloads
tests:
  - it: creates the MLflow CR when enabled and not already present
    set:
      mlflow.enabled: true
      mlflow.instance: mlflow
      mlflow.storageClass: gp3-csi
      mlflow.storageSize: 10Gi
      mlflow.retain: true
    asserts:
      - isKind:
          of: MLflow
      - equal:
          path: metadata.name
          value: mlflow
      - equal:
          path: spec.storage.storageClassName
          value: gp3-csi
      - equal:
          path: spec.storage.resources.requests.storage
          value: 10Gi
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: skips MLflow CR when disabled
    set:
      mlflow.enabled: false
    asserts:
      - hasDocuments:
          count: 0
