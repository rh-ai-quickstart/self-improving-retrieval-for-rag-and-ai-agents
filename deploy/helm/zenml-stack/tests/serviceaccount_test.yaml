suite: Orchestrator service account
templates:
  - serviceaccount.yaml
  - imagestream.yaml
release:
  name: zenml-stack
  namespace: zenml-workloads
tests:
  - it: creates the orchestrator service account
    template: serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: zenml-orchestrator

  - it: creates the ZenML ImageStream when registry integration is enabled
    set:
      registry.enabled: true
      registry.imageStreamName: zenml
    template: imagestream.yaml
    asserts:
      - isKind:
          of: ImageStream
      - equal:
          path: metadata.name
          value: zenml

  - it: skips ImageStream when registry integration is disabled
    set:
      registry.enabled: false
    template: imagestream.yaml
    asserts:
      - hasDocuments:
          count: 0
