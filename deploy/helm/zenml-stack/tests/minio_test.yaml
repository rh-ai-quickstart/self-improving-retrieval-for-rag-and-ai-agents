suite: MinIO workload resources
templates:
  - minio-deployment.yaml
  - minio-pvc.yaml
  - minio-secret.yaml
release:
  name: zenml-stack
  namespace: zenml-workloads
tests:
  - it: renders MinIO deployment with configured image and security context
    set:
      minio.enabled: true
      minio.image: quay.io/minio/minio:test
    template: minio-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: minio
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/minio/minio:test
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: renders MinIO PVC with configured storage class
    set:
      minio.enabled: true
      minio.storageClass: gp3-csi
      minio.storageSize: 10Gi
    template: minio-pvc.yaml
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: minio-data
      - equal:
          path: spec.storageClassName
          value: gp3-csi
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: renders MinIO credentials Secret from values
    set:
      minio.enabled: true
      minio.rootUser: zenml-admin
      minio.rootPassword: test-minio-password
    template: minio-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: minio-root
      - equal:
          path: stringData.MINIO_ROOT_USER
          value: zenml-admin
      - equal:
          path: stringData.MINIO_ROOT_PASSWORD
          value: test-minio-password

  - it: skips MinIO resources when disabled
    set:
      minio.enabled: false
    template: minio-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
