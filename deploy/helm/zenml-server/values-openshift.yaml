# OpenShift-specific overrides for the zenml-server umbrella chart.
#
# MySQL image: Bitnami chart 11.1.19 pins docker.io/bitnami/mysql:8.4.3-debian-12-r0,
# which Docker Hub no longer serves (manifest unknown). The same tag is published
# at docker.io/bitnamilegacy/mysql:8.4.3-debian-12-r0. The original
# openshift/mysql-persistent template uses ImageStreamTag mysql:8.0-el8
# (registry.redhat.io/rhel8/mysql-80:latest); that image is not drop-in
# compatible with the Bitnami subchart. bitnamilegacy is public on docker.io,
# so no imagePullSecret is required.

zenml:
  podSecurityContext:
    fsGroup: null
    fsGroupChangePolicy: null
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: null
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  server:
    ingress:
      enabled: false

mysql:
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: 8.4.3-debian-12-r0
    pullPolicy: IfNotPresent
