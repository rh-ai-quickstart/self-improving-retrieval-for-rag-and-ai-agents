zenml:
  enabled: true
  podSecurityContext:
    fsGroup: null
    fsGroupChangePolicy: null
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: null
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  server:
    ingress:
      enabled: false
    database:
      url: mysql://zenml@zenml-mysql:3306/zenml
      passwordSecretRef:
        name: zenml-db-password
        key: password

mysql:
  enabled: true
  fullnameOverride: zenml-mysql
  auth:
    database: zenml
    username: zenml
    # Passwords are supplied through secrets.yaml or deployment.env.
    password: ""
    rootPassword: ""
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 1Gi

database:
  passwordSecretName: zenml-db-password
  # Passwords are supplied through secrets.yaml or deployment.env.
  password: ""
  rootPassword: ""
  name: zenml
  user: zenml
  serviceName: zenml-mysql

route:
  enabled: true
  name: zenml-server
  serviceName: zenml-server
  host: ""

zenmlRelease:
  serviceName: zenml-server
