suite: ZenML database Secret
templates:
  - zenml-db-secret.yaml
release:
  name: zenml-server
  namespace: zenml
tests:
  - it: creates the database Secret when not already present
    set:
      database.password: test-db-password
      database.rootPassword: test-root-password
      database.passwordSecretName: zenml-db-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: zenml-db-password
      - equal:
          path: stringData.password
          value: test-db-password
      - equal:
          path: stringData["mysql-root-password"]
          value: test-root-password
