apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: zenml-stack-resources
parameters:
  - name: MINIO_IMAGE
    required: true
  - name: MINIO_SECRET_NAME
    required: true
  - name: MINIO_STORAGE_CLASS
    required: true
  - name: MINIO_STORAGE_SIZE
    required: true
  - name: MINIO_ROUTE_NAME
    required: true
objects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: minio-data
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: zenml-stack-bootstrap
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: ${MINIO_STORAGE_CLASS}
      resources:
        requests:
          storage: ${MINIO_STORAGE_SIZE}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: minio
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: zenml-stack-bootstrap
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: minio
      template:
        metadata:
          labels:
            app.kubernetes.io/name: minio
            app.kubernetes.io/part-of: zenml-stack-bootstrap
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: minio
              image: ${MINIO_IMAGE}
              args:
                - server
                - /data
                - --console-address
                - :9001
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${MINIO_SECRET_NAME}
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${MINIO_SECRET_NAME}
                      key: MINIO_ROOT_PASSWORD
              ports:
                - name: s3
                  containerPort: 9000
                - name: console
                  containerPort: 9001
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              livenessProbe:
                httpGet:
                  path: /minio/health/live
                  port: s3
                initialDelaySeconds: 10
                periodSeconds: 10
              readinessProbe:
                httpGet:
                  path: /minio/health/ready
                  port: s3
                initialDelaySeconds: 5
                periodSeconds: 5
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: minio-data

  - apiVersion: v1
    kind: Service
    metadata:
      name: minio
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: zenml-stack-bootstrap
    spec:
      selector:
        app.kubernetes.io/name: minio
      ports:
        - name: s3
          port: 9000
          targetPort: s3

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${MINIO_ROUTE_NAME}
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: zenml-stack-bootstrap
    spec:
      port:
        targetPort: s3
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      to:
        kind: Service
        name: minio
        weight: 100

