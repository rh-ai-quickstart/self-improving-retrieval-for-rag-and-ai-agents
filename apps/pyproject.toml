[project]
name = "retrieval-model-selection"
version = "0.1.0"
description = "ZenML pipeline and FAISS search app for TechQA retrieval."
requires-python = ">=3.11"
dependencies = [
    "zenml[server]==0.96.2",
    "docker~=7.1.0",
    "sentence-transformers>=5,<6",
    "datasets>=4,<5",
    "faiss-cpu>=1.9,<2",
    "fastapi>=0.115,<1",
    "kubernetes>=25,<26",
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "torch==2.13.0",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["apps*"]
exclude = ["apps.tests*"]

[tool.setuptools.package-data]
"apps.retrieval_poc.search_app" = ["static/*"]
