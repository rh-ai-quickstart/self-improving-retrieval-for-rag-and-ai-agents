[project]
name = "retrieval-model-selection"
version = "0.1.0"
description = "ZenML pipeline and FAISS search app for TechQA retrieval."
requires-python = ">=3.11"
dependencies = [
    "zenml[server]==0.96.2",
    "docker~=7.1.0",
    "sentence-transformers>=5,<6",
    "datasets>=4,<5",
    # datasets requires fsspec<=2026.2.0; keep s3fs on the same calendar release
    # so ZenML's S3 artifact store (s3fs) stays compatible after
    # `zenml integration install s3`.
    "fsspec[http]==2026.2.0",
    "s3fs==2026.2.0",
    "faiss-cpu>=1.9,<2",
    "fastapi>=0.115,<1",
    "kubernetes>=25,<26",
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "torch==2.13.0",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["apps/tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["apps*"]
exclude = ["apps.tests*"]

[tool.setuptools.package-data]
"apps.retrieval_poc.search_app" = ["static/*"]
