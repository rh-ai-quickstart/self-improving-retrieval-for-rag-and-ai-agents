apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: minio-bootstrap-job
parameters:
  - name: MINIO_CLIENT_IMAGE
    required: true
  - name: MINIO_SECRET_NAME
    required: true
  - name: MINIO_BUCKET
    required: true
objects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: minio-bootstrap
      labels:
        app.kubernetes.io/name: minio-bootstrap
        app.kubernetes.io/part-of: zenml-stack-bootstrap
    spec:
      backoffLimit: 4
      template:
        metadata:
          labels:
            app.kubernetes.io/name: minio-bootstrap
            app.kubernetes.io/part-of: zenml-stack-bootstrap
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mc
              image: ${MINIO_CLIENT_IMAGE}
              env:
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${MINIO_SECRET_NAME}
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${MINIO_SECRET_NAME}
                      key: MINIO_ROOT_PASSWORD
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  until mc alias set minio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                    echo "Waiting for MinIO..."
                    sleep 2
                  done

                  mc mb --ignore-existing "minio/${MINIO_BUCKET}"
                  printf '%s\n' "ZenML artifact store test" | mc pipe "minio/${MINIO_BUCKET}/smoke-test.txt"
                  mc ls "minio/${MINIO_BUCKET}"
                  mc cat "minio/${MINIO_BUCKET}/smoke-test.txt"

