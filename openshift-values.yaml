podSecurityContext:
  fsGroup: null
  fsGroupChangePolicy: null
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: null
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

server:
  ingress:
    enabled: false

