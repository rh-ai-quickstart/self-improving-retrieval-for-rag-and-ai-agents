name: Helm tests

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - "scripts/test_helm_charts.sh"
      - ".github/workflows/helm-tests.yml"
      - "Makefile"
      - "justfile"
  push:
    branches:
      - main
      - dev
    paths:
      - "deploy/helm/**"
      - "scripts/test_helm_charts.sh"
      - ".github/workflows/helm-tests.yml"
      - "Makefile"
      - "justfile"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Run Helm chart tests
        run: ./scripts/test_helm_charts.sh
